name: Three-run full pipeline benchmark
on: workflow_dispatch
permissions: {contents: read}
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: python3 scripts/smoke.py
      - run: python3 scripts/pipeline-benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: full-pipeline, path: evidence/}
      - run: docker compose down
        if: always()
  archive:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: 'benchmarks/runs/${{ github.run_id }}'}
      - name: Preserve every completed and incomplete trial
        env: {RUN_ID: '${{ github.run_id }}'}
        run: |
          mkdir -p "benchmarks/runs/$RUN_ID"
          echo "Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "benchmarks/runs/$RUN_ID/README.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f benchmarks/runs
          git commit -m "Record full pipeline run $RUN_ID [skip ci]"
          for attempt in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 2; done
          exit 1
